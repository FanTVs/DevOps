services:
  backend:
    build: ./backend
    image: devops-backend
    volumes:
      - ./data:/app/data
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: devops-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge